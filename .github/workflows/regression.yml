name: Regression

on:
  workflow_dispatch:
    # To dispatch workflow manually

  schedule:
    # Scheduling on Monday at 03:15 UTC. 
    # Off-the-hour to reduce GitHub Actions scheduling delays that peak on the hour.
    # cron:  <minute(0-59)> <hour(0-23)> <month-day(1-31) <month(1-12)> <week-day(0-6)>
    - cron: "15 3 * * 1"

  push:
    # Dispatched automatically on push only for branches starting with `regression/` 
    branches:
      - "regression/**"

jobs:
  # Regression only runs the default (first) version entry, so resolve the default versions directly
  # and expose them as plain job outputs. Broader version coverage lives in the CI Pipeline.
  prepare:
    if: github.server_url != 'https://github.com'
    name: Resolve default versions and Docker image ref
    runs-on: ubuntu-latest
    outputs:
      VER_PYTHON: ${{ steps.versions.outputs.VER_PYTHON }}
      VER_TORCH: ${{ steps.versions.outputs.VER_TORCH }}
      VER_CUDA: ${{ steps.versions.outputs.VER_CUDA }}
      IMAGE_NAME: ${{ steps.versions.outputs.IMAGE_NAME }}
      IMAGE_TAG: ${{ steps.versions.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve default versions and image ref
        id: versions
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
        run: |
          test $(git hash-object .dockerignore) = 33dafa6305deba799c6f414184eb723f07ef8c1d # Reminder: if .dockerignore changes, update the tag computation below.
          read -r VER_PYTHON VER_TORCH VER_CUDA <<< "$(python3 scripts/versions.py default)"
          {
            echo "VER_PYTHON=${VER_PYTHON}"
            echo "VER_TORCH=${VER_TORCH}"
            echo "VER_CUDA=${VER_CUDA}"
            echo "IMAGE_NAME=${DOCKER_REGISTRY}/${DOCKER_IMAGE}-regr-py${VER_PYTHON}-pt${VER_TORCH}-cu${VER_CUDA}"
            echo "IMAGE_TAG=$(git ls-tree HEAD docker pyproject.toml | git hash-object --stdin | head -c 8)"
          } >> "$GITHUB_OUTPUT"

  docker:
    if: github.server_url != 'https://github.com'
    name: Build Docker image (default versions)
    runs-on: ubuntu-latest
    needs: prepare
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.IMAGE_NAME }}
      IMAGE_TAG: ${{ needs.prepare.outputs.IMAGE_TAG }}
    steps:
      - run: sudo cp /tmp/certs/* /usr/local/share/ca-certificates/ && sudo update-ca-certificates
      - name: Check if image was already built before
        run: |
          IMAGE_REF=$(python3 -c "netloc, path = '${IMAGE_NAME}'.split('/',1); print(f'https://{netloc}/v2/{path}/manifests/${IMAGE_TAG}')")
          echo "Checking if ${IMAGE_REF} was already built."
          if curl --fail --silent --location --head --header "Authorization: Bearer ${{ secrets.DOCKER_CREDENTIALS }}" --header "Accept: application/vnd.docker.distribution.manifest.v2+json" "${IMAGE_REF}" ; then
            echo "Image ref was already built, skipping build."
            echo SKIP_BUILD=1 >> $GITHUB_ENV
          else
            echo "Image ref not yet available, proceeding to build."
          fi
      - if: ${{ !env.SKIP_BUILD }}
        uses: actions/checkout@v4
      - if: ${{ !env.SKIP_BUILD }}
        run: |
          docker build -f docker/Dockerfile.regression -t "${IMAGE_NAME}:${IMAGE_TAG}" --build-arg VER_PYTHON="${{ needs.prepare.outputs.VER_PYTHON }}" --build-arg VER_CUDA="${{ needs.prepare.outputs.VER_CUDA }}" --build-arg VER_TORCH="${{ needs.prepare.outputs.VER_TORCH }}" .
          echo '${{ secrets.DOCKER_CREDENTIALS }}' | docker login --username '${{ secrets.DOCKER_LOGIN }}' --password-stdin '${{ vars.DOCKER_REGISTRY }}'
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"

  wheels:
    if: github.server_url != 'https://github.com'
    name: Build wheel
    runs-on: ubuntu-latest
    container:
      image: python:3.12
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install build
          python3 -m build --verbose --wheel --outdir=wheelhouse/
      - uses: actions/upload-artifact@v3
        with:
          name: "fastforward"
          path: "wheelhouse/*.whl"
          if-no-files-found: error
          retention-days: 1

  pytest:
    if: github.server_url != 'https://github.com'
    name: "regression tests (py${{ needs.prepare.outputs.VER_PYTHON }}, torch${{ needs.prepare.outputs.VER_TORCH }}, cuda${{ needs.prepare.outputs.VER_CUDA }})"
    runs-on: k8s-gpu
    needs: [prepare, wheels, docker]
    # Downloads several multi-GB models checkpoints and runs perplexity eval on each.
    # Give it generous headroom.
    timeout-minutes: 360
    container:
      image: "${{ needs.prepare.outputs.IMAGE_NAME }}:${{ needs.prepare.outputs.IMAGE_TAG }}"
      credentials:
        username: ${{ secrets.DOCKER_LOGIN }}
        password: ${{ secrets.DOCKER_CREDENTIALS }}
    env:
      VER_CUDA: ${{ needs.prepare.outputs.VER_CUDA }}
      HF_HUB_OFFLINE: ${{ vars.HF_HUB_OFFLINE }}
      HF_HUB_CACHE: ${{ vars.HF_HUB_CACHE }}
      HF_DATASETS_CACHE: ${{ vars.HF_DATASETS_CACHE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests_regression
            pyproject.toml

      - uses: actions/download-artifact@v3
        with:
          name: "fastforward"
          path: "wheelhouse"

      - name: Install fastforward wheel
        run: python3 -m pip install --no-cache-dir --no-dependencies "$(find wheelhouse -name '*.whl')"

      - name: Run regression suite
        run: python3 -m pytest ./tests_regression
